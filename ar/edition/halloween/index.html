      (() => {

        const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

        const introCv = $('[data-intro]'), intro = !still && window.mkDive ? window.mkDive(introCv, {tint: '#ff8a1f', bokeh: .5, fx: D.fx}) : null;
        let ready = false;
        const wake = () => {if (ready) return; ready = true; intro?.stop(); intro?.seek(1); html.classList.add('hw-ready');};
        if (intro) {intro.play(D.intro, {seconds: 7.5, onDone: wake}); addEventListener('pointerdown', e => {if (!e.target.closest('header')) wake();}, {once: true}); addEventListener('keydown', wake, {once: true});}

        const dlg = $('[data-live]'), cutCv = $('[data-cut]'), cut = window.mkDive ? window.mkDive(cutCv, {tint: '#ff8a1f', bokeh: .4, fx: D.fx}) : null;
        const line = $('[data-line]');
        document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
          const p = D.portraits[+b.dataset.open];
          $('[data-room]').textContent = p.room; $('[data-name]').textContent = p.name; $('[data-curse]').textContent = p.curse;
          $('[data-film]').href = p.url;

          let shown = -1; line.classList.remove('is-in'); line.textContent = '';

        }));

<style>
:root {
  --paper: #f5efe6; --paper-deep: #ede5d9; --card: #fffcf7; --ink: #2a2119; --ink-2: #4b3e33; --muted: #75685b;
  --accent: #8a5d34; --accent-ink: #fffcf7; --line: rgba(42,33,25,.14); --line-2: rgba(42,33,25,.24); --ok: #2f6b45;
  --f-lat: "Manrope", "Readex Pro", system-ui, sans-serif;
  --f-ar: "Readex Pro", "Manrope", system-ui, sans-serif;
  --f-mark: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: radial-gradient(900px 700px at 50% 0%, #faf6ef 0%, var(--paper) 55%, var(--paper-deep) 100%) fixed; color: var(--ink);
  font: 500 16px/1.5 var(--f-ar); padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
html[lang="en"] body { font-family: var(--f-lat); }
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.lang { font: 700 13px var(--f-lat); letter-spacing: .08em; color: var(--ink-2); background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.lang:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.who { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 6px 0 10px; }
.who svg { width: 96px; height: 96px; }
.who h1 { margin: 6px 0 0; font: 800 26px/1.15 var(--f-lat); letter-spacing: -0.01em; }
.who .handle { font: 600 14px var(--f-lat); color: var(--muted); }
.who p { margin: 4px 0 0; color: var(--ink-2); font-size: 15.5px; max-width: 34ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 18px 16px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 14px 34px -22px rgba(42,33,25,.35); }
.card.primary { border-color: rgba(138,93,52,.45); }
.eyebrow { font: 700 11.5px var(--f-lat); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.card h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 700; }
.card h2 .lat { font-family: var(--f-lat); font-weight: 800; }
.card p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.badge { display: inline-block; font: 700 12px var(--f-lat); color: var(--ok); border: 1px solid rgba(47,107,69,.35); background: rgba(47,107,69,.07); border-radius: 999px; padding: 3px 10px; margin-top: 10px; }
form { display: grid; gap: 10px; margin-top: 14px; }
label { display: grid; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 12px; width: 100%; min-height: 46px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 10px; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font: 700 16px var(--f-ar); cursor: pointer; text-decoration: none; padding: 12px 16px; }
html[lang="en"] .btn { font-family: var(--f-lat); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-2); }
.btn svg { width: 20px; height: 20px; flex: none; }
.alt { font-size: 13px; color: var(--muted); text-align: center; }
.alt a { color: var(--ink-2); }
.links { display: grid; gap: 10px; }
.link { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; min-height: 58px; }
.link b { display: block; font-size: 16px; }
.link span { display: block; font-size: 13.5px; color: var(--muted); }
.link svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
html[dir="rtl"] .flip { transform: scaleX(-1); }
.soon { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.soon i { font: 700 12.5px var(--f-lat); font-style: normal; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: 999px; padding: 5px 11px; }
.social { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-top: 4px; }
.social a { font: 700 13px var(--f-lat); color: var(--ink-2); text-decoration: none; border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 13px; }
footer { text-align: center; font-size: 12.5px; color: var(--muted); padding-top: 6px; }
[hidden] { display: none !important; }
.sent { margin-top: 10px; font-size: 13.5px; color: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .card, .link { transition: transform .18s ease, box-shadow .18s ease; } .link:active { transform: scale(.99); } }
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <span></span>
    <button class="lang" id="lang" type="button" aria-label="Switch language">English</button>
  </div>

  <header class="who">
    <svg viewBox="0 0 96 96" role="img" aria-label="MK">
      <circle cx="48" cy="48" r="45" fill="#2a2119"/>
      <circle cx="48" cy="48" r="45" fill="none" stroke="#8a5d34" stroke-width="2.5"/>
      <circle cx="48" cy="48" r="40.5" fill="none" stroke="#f5efe6" stroke-opacity=".14" stroke-width="1"/>
      <text x="48" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#f5efe6" letter-spacing="1">MK</text>
    </svg>
    <h1>MK by Mohamed</h1>
    <div class="handle" dir="ltr">@mkbymohamed</div>
    <p data-ar="أبني تطبيقات MK اللي بتشغّل الشركات." data-en="I build the MK apps that run a business."></p>
  </header>

  <section class="card primary" aria-labelledby="h-pilot">
    <p class="eyebrow" data-ar="تجربة مجانية" data-en="Free pilot"></p>
    <h2 id="h-pilot" data-ar="جرّب <span class='lat' dir='ltr'>MK Business OS</span> مجانًا لشركتك" data-en="Try <span class='lat'>MK Business OS</span> free in your company"></h2>
    <p data-ar="بدوّر على ٥ شركات في الكويت والخليج. بتكتب بتبيع إيه، وهو يلاقي مشترين حقيقيين ليهم مصدر، ويجهّز أول رسالة وانت اللي توافق." data-en="Looking for 5 companies in Kuwait and the Gulf. Type what you sell; it finds real buyers with a source you can check, drafts the first message, and waits for your OK."></p>
    <span class="badge" data-ar="٥ أماكن" data-en="5 spots"></span>
    <form id="pilot" novalidate>
      <label><span data-ar="اسم الشركة" data-en="Company"></span><input name="company" autocomplete="organization" required maxlength="80"></label>
      <label><span data-ar="بتبيعوا إيه؟" data-en="What do you sell?"></span><input name="sells" required maxlength="120"></label>
      <div class="row2">
        <label><span data-ar="الدولة" data-en="Country"></span>
          <select name="country">
            <option value="KW" data-ar="الكويت" data-en="Kuwait"></option><option value="SA" data-ar="السعودية" data-en="Saudi Arabia"></option>
            <option value="AE" data-ar="الإمارات" data-en="UAE"></option><option value="QA" data-ar="قطر" data-en="Qatar"></option>
            <option value="BH" data-ar="البحرين" data-en="Bahrain"></option><option value="OM" data-ar="عُمان" data-en="Oman"></option>
            <option value="EG" data-ar="مصر" data-en="Egypt"></option><option value="XX" data-ar="غير ذلك" data-en="Other"></option>
          </select></label>
        <label><span data-ar="حجم الفريق" data-en="Team size"></span>
          <select name="team"><option value="1–5" data-ar="من ١ إلى ٥" data-en="1–5"></option><option value="6–20" data-ar="من ٦ إلى ٢٠" data-en="6–20"></option><option value="21–50" data-ar="من ٢١ إلى ٥٠" data-en="21–50"></option><option value="50+" data-ar="أكتر من ٥٠" data-en="50+"></option></select></label>
      </div>
      <button class="btn" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg><span data-ar="ابعت على واتساب" data-en="Send on WhatsApp"></span></button>
      <div class="alt"><span data-ar="مش بتستخدم واتساب؟" data-en="No WhatsApp?"></span> <a id="pilot-mail" href="#" data-ar="ابعت إيميل" data-en="Send an email"></a></div>
      <div class="sent" id="pilot-sent" hidden data-ar="تمام! كمّل في واتساب وهرد عليك." data-en="Done — finish in WhatsApp and I'll reply."></div>
    </form>
  </section>

  <section class="card" aria-labelledby="h-jo">
    <p class="eyebrow" data-ar="تسجيل مبكر" data-en="Early access"></p>
    <h2 id="h-jo" data-ar="<span class='lat' dir='ltr'>Job Orbit</span> بيدوّر لك على شغل كل يوم" data-en="<span class='lat'>Job Orbit</span> hunts jobs with you every day"></h2>
    <p data-ar="برنامج Windows: بيلاقي الوظايف، ويقيّمها على حقايقك انت، ويجهّز الـCV والجواب للأحسن… ومفيش حاجة بتتبعت غير لما توافق." data-en="A Windows app: it finds jobs, checks them against your own facts, prepares the CV and letter for the best ones — and sends nothing until you approve."></p>
    <form id="jo" novalidate>
      <div class="row2">
        <label><span data-ar="بلدك" data-en="Your country"></span>
          <select name="country">
            <option value="EG" data-ar="مصر" data-en="Egypt"></option><option value="KW" data-ar="الكويت" data-en="Kuwait"></option>
            <option value="SA" data-ar="السعودية" data-en="Saudi Arabia"></option><option value="AE" data-ar="الإمارات" data-en="UAE"></option>
            <option value="XX" data-ar="غير ذلك" data-en="Other"></option>
          </select></label>
        <label><span data-ar="الوظيفة اللي بتدوّر عليها" data-en="Job you want"></span><input name="role" maxlength="80"></label>
      </div>
      <button class="btn ghost" type="submit"><span data-ar="سجّلني في التسجيل المبكر" data-en="Put me on the early-access list"></span></button>
      <div class="sent" id="jo-sent" hidden data-ar="تمام! هبعتلك أول ما التحميل يفتح." data-en="Done — I'll message you when the download opens."></div>
    </form>
  </section>

  <nav class="links" aria-label="More">
    <a class="link" id="films" href="../en/motion/"><div><b data-ar="شوف الأفلام" data-en="Watch the films"></b><span data-ar="أفلام تطبيقات MK" data-en="The MK app films"></span></div><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="link" id="services" href="../en/services/"><div><b data-ar="اشتغل معايا" data-en="Work with me"></b><span data-ar="أفلام للتطبيقات · مواقع سينمائية · أنظمة أتمتة" data-en="App films · cinematic websites · automation"></span></div><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </nav>

  <section class="card" aria-labelledby="h-soon">
    <p class="eyebrow" data-ar="قريبًا" data-en="Coming soon"></p>
    <h2 id="h-soon" data-ar="<span class='lat' dir='ltr'>MK Cloud</span>: كل تطبيقات MK في حساب واحد" data-en="<span class='lat'>MK Cloud</span>: every MK app, one account"></h2>
    <div class="soon" dir="ltr"><i>MK Business OS</i><i>Job Orbit</i><i>Talent Atlas</i><i>MK Voice</i></div>
  </section>

  <div class="social" dir="ltr" aria-label="Follow">
    <a href="https://www.tiktok.com/@mkbymohamed" rel="noopener">TikTok</a>
    <a href="https://www.instagram.com/mkbymohamed/" rel="noopener">Instagram</a>
    <a href="https://www.facebook.com/mkbymohamed" rel="noopener">Facebook</a>
    <a href="https://www.youtube.com/@mkbymohamed" rel="noopener">YouTube</a>
    <a href="https://www.linkedin.com/in/mohamed-mahmoud-5a748b243" rel="noopener">LinkedIn</a>
  </div>
  <footer><span data-ar="محمد محمود · الصفحة دي من غير تتبّع" data-en="Mohamed Mahmoud · no trackers on this page"></span></footer>
</main>

<script>
(function () {
  var WA = "96599338996", MAIL = "medo433447@gmail.com";
  var SRC = { tt: "TikTok", ig: "Instagram", fb: "Facebook", yt: "YouTube", li: "LinkedIn", x: "X", sc: "Snapchat" };
  var q = new URLSearchParams(location.search);
  var src = SRC[(q.get("src") || "").toLowerCase()] || "";
  var lang = (q.get("lang") || "").toLowerCase();
  if (lang !== "ar" && lang !== "en") {
    try { lang = localStorage.getItem("mk-links-lang") || ""; } catch (e) { lang = ""; }
    if (lang !== "ar" && lang !== "en") lang = /^ar\b/i.test(navigator.language || "") ? "ar" : (q.get("src") ? "ar" : "en");
  }
  function apply(l) {
    lang = l;
    document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-ar]").forEach(function (el) { el.innerHTML = el.getAttribute("data-" + l); });
    document.getElementById("lang").textContent = l === "ar" ? "English" : "العربية";
    document.getElementById("films").href = "../" + l + "/motion/";
    document.getElementById("services").href = "../" + l + "/services/";
    document.title = l === "ar" ? "MK by Mohamed — الروابط" : "MK by Mohamed — links";
    try { localStorage.setItem("mk-links-lang", l); } catch (e) {}
  }
  document.getElementById("lang").addEventListener("click", function () { apply(lang === "ar" ? "en" : "ar"); });
  apply(lang);

  function label(sel) { var o = sel.options[sel.selectedIndex]; return o ? o.textContent : ""; }
  function via() { return src ? (lang === "ar" ? "\n(من " + src + ")" : "\n(via " + src + ")") : ""; }
  function pilotText(f) {
    var c = f.company.value.trim(), s = f.sells.value.trim(), k = label(f.country), t = label(f.team);
    return lang === "ar"
      ? "السلام عليكم، عايز أجرّب MK Business OS مجانًا.\nالشركة: " + c + "\nبنبيع: " + s + "\nالدولة: " + k + "\nحجم الفريق: " + t + via()
      : "Hi Mohamed, I'd like the free MK Business OS pilot.\nCompany: " + c + "\nWe sell: " + s + "\nCountry: " + k + "\nTeam size: " + t + via();
  }
  function open(url) { if (typeof window.__mkOpen === "function") return window.__mkOpen(url); window.location.href = url; }
  var pilot = document.getElementById("pilot");
  pilot.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!pilot.company.value.trim()) { pilot.company.focus(); return; }
    if (!pilot.sells.value.trim()) { pilot.sells.focus(); return; }
    document.getElementById("pilot-sent").hidden = false;
    open("https://wa.me/" + WA + "?text=" + encodeURIComponent(pilotText(pilot)));
  });
  document.getElementById("pilot-mail").addEventListener("click", function (e) {
    e.preventDefault();
    var subj = lang === "ar" ? "تجربة MK Business OS المجانية" : "MK Business OS free pilot";
    open("mailto:" + MAIL + "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(pilotText(pilot)));
  });
  var jo = document.getElementById("jo");
  jo.addEventListener("submit", function (e) {
    e.preventDefault();
    var k = label(jo.country), r = jo.role.value.trim();
    var t = lang === "ar"
      ? "السلام عليكم، عايز أدخل التسجيل المبكر لـ Job Orbit.\nبلدي: " + k + (r ? "\nالوظيفة اللي بدوّر عليها: " + r : "") + via()
      : "Hi Mohamed, please add me to the Job Orbit early-access list.\nCountry: " + k + (r ? "\nJob I want: " + r : "") + via();
    document.getElementById("jo-sent").hidden = false;
    open("https://wa.me/" + WA + "?text=" + encodeURIComponent(t));
  });
})();
</script>
</body>
</html>

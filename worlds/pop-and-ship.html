<noscript><meta http-equiv="refresh" content="0; url=../en/pop-and-ship/"></noscript><!-- (in noscript: it must not race the script's choice of language) -->
<script>
  (function () {
    var l = new URLSearchParams(location.search).get('lang');
    if (l !== 'ar' && l !== 'en') { try { l = localStorage.getItem('mm-lang'); } catch (e) {} }
    location.replace('../' + (l === 'ar' ? 'ar' : 'en') + '/pop-and-ship/' + location.hash);
  })();
</script>
